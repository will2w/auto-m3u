          CITY_TO_PROV_PINYIN["四川"]="10_sichuan"; CITY_TO_PROV_PINYIN["sichuan"]="10_sichuan"
          for city in "成都" "绵阳" "德阳" "南充" "宜宾" "乐山" "达州" "自贡" "攀枝花" "泸州" "广元" "遂宁" "内江" "眉山" "广安" "雅安" "巴中" "资阳"; do
