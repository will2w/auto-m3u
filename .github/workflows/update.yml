          CITY_TO_PROV_PINYIN["河南"]="16_henan"; CITY_TO_PROV_PINYIN["henan"]="16_henan"
          for city in "郑州" "洛阳" "南阳" "新乡" "许昌" "安阳" "平顶山" "开封" "鹤壁" "焦作" "濮阳" "漯河" "三门峡" "商丘" "信阳" "周口" "驻马店"; do
              CITY_TO_PROV["$city"]="河南"; CITY_TO_PROV_PINYIN["$city"]="16_henan"
          done

          CITY_TO_PROV_PINYIN["安徽"]="17_anhui"; CITY_TO_PROV_PINYIN["anhui"]="17_anhui"
          for city in "合肥" "芜湖" "蚌埠" "淮南" "马鞍山" "安庆" "黄山" "滁州" "阜阳" "宿州" "六安" "亳州" "池州" "宣城" "淮北" "铜陵"; do
              CITY_TO_PROV["$city"]="安徽"; CITY_TO_PROV_PINYIN["$city"]="17_anhui"
          done

          CITY_TO_PROV_PINYIN["江西"]="18_jiangxi"; CITY_TO_PROV_PINYIN["jiangxi"]="18_jiangxi"
          for city in "南昌" "赣州" "九江" "宜春" "上饶" "景德镇" "萍乡" "新余" "鹰潭" "吉安" "抚州"; do
              CITY_TO_PROV["$city"]="江西"; CITY_TO_PROV_PINYIN["$city"]="18_jiangxi"
          done

          CITY_TO_PROV_PINYIN["陕西"]="19_shaanxi"; CITY_TO_PROV_PINYIN["shaanxi"]="19_shaanxi"
          for city in "西安" "宝鸡" "咸阳" "渭南" "延安" "汉中" "榆林" "安康" "商洛" "铜川"; do
              CITY_TO_PROV["$city"]="陕西"; CITY_TO_PROV_PINYIN["$city"]="19_shaanxi"
          done

          CITY_TO_PROV_PINYIN["广西"]="20_guangxi"; CITY_TO_PROV_PINYIN["guangxi"]="20_guangxi"
          for city in "南宁" "柳州" "桂林" "北海" "防城港" "钦州" "贵港" "玉林" "百色" "贺州" "河池" "来宾" "崇左" "梧州"; do
