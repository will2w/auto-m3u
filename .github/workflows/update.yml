          done

          CITY_TO_PROV_PINYIN["甘肃"]="22_gansu"; CITY_TO_PROV_PINYIN["gansu"]="22_gansu"
          for city in "兰州" "嘉峪关" "金昌" "白银" "天水" "武威" "张掖" "平凉" "酒泉" "庆阳" "定西" "陇南"; do
