          CITY_TO_PROV_PINYIN["云南"]="21_yunnan"; CITY_TO_PROV_PINYIN["yunnan"]="21_yunnan"
          for city in "昆明" "曲靖" "玉溪" "保山" "昭通" "丽江" "普洱" "临沧" "楚雄" "红河" "文山" "西双版纳" "大理" "德宏" "怒江" "迪庆"; do
