          CITY_TO_PROV_PINYIN["山东"]="09_shandong"; CITY_TO_PROV_PINYIN["shandong"]="09_shandong"
          for city in "济南" "青岛" "淄博" "枣庄" "东营" "烟台" "潍坊" "济宁" "泰安" "威海" "日照" "临沂" "德州" "聊城" "滨州" "菏泽"; do
