          done

          CITY_TO_PROV_PINYIN["江苏"]="08_jiangsu"; CITY_TO_PROV_PINYIN["jiangsu"]="08_jiangsu"
          for city in "南京" "苏州" "无锡" "常州" "徐州" "南通" "连云港" "淮安" "盐城" "扬州" "镇江" "泰州" "宿迁"; do
